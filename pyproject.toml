[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-brain"
version = "0.4.1"
description = "A local Markdown memory workspace for desktop users and MCP agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Shared Brain contributors"}]
dependencies = [
    "mcp>=1.26,<2",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "pywebview>=6,<7",
    "pystray>=0.19,<1",
    "Pillow>=10",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
shared-brain = "shared_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shared_brain = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
